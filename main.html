<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大專院校查詢系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .university-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            position: relative;
        }

        .university-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .university-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .university-card.expanding {
            position: fixed;
            z-index: 1000;
        }

        .university-card.expanded {
            cursor: default;
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.95);
        }

        .university-card.expanded::-webkit-scrollbar {
            width: 8px;
        }

        .university-card.expanded::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .university-card.expanded::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .university-name {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
            transition: font-size 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
        }

        .expanded .university-name {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .website-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            visibility: hidden;
        }

        .website-grid.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }

        .website-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 0.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.95);
            opacity: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .website-grid.active .website-item {
            transform: scale(1);
            opacity: 1;
        }

        .website-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .website-link {
            color: #e0e0e0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .website-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
            color: #fff;
        }

        .website-item:hover .website-icon {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.1);
        }

        .website-info {
            flex-grow: 1;
        }

        .website-name {
            font-weight: bold;
            margin-bottom: 0.3rem;
            color: #fff;
        }

        .website-description {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .close-button {
            position: fixed; /* 改為 fixed，讓按鈕固定在視窗上 */
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8) rotate(-180deg);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 新增樣式 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .close-button.active {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .close-button:hover {
            transform: scale(1.1) rotate(90deg);
            background: rgba(255, 255, 255, 0.1);
        }

        .website-count {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .university-grid {
                grid-template-columns: 1fr;
            }

            .website-grid {
                grid-template-columns: 1fr;
            }

            .expanded .university-name {
                font-size: 1.5rem;
            }
            .close-button {
                top: 0.8rem;
                right: 0.8rem;
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
                background: rgba(20, 20, 20, 0.9); /* 深色背景，增加可見度 */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜尋學校名稱...">
        </div>

        <div class="university-grid" id="universityGrid">
            <!-- 動態生成的內容將在這裡 -->
        </div>
    </div>

    <button class="close-button" id="closeButton">&times;</button>

    <script>
        // 學校資料
        const schoolsData = [
            {
                name: '國立臺灣大學',
                websites: [
                    { url: 'https://www.ntu.edu.tw', description: '臺灣大學首頁' },
                    { url: 'https://my.ntu.edu.tw/', description: '臺灣大學 MyNTU' },
                    { url: 'https://www.lib.ntu.edu.tw/', description: '臺灣大學 圖書館' },
                    { url: 'https://if192.aca.ntu.edu.tw/index.php', description: '臺灣大學 網路選課系統' },
                    { url: 'https://moodle.ntu.edu.tw', description: '臺灣大學 Moodle' }
                ]
            },
            {
                name: '國立成功大學',
                websites: [
                    { url: 'https://www.ncku.edu.tw', description: '成功大學首頁' },
                    { url: 'https://i.ncku.edu.tw/', description: '成功大學 成功入口' },
                    { url: 'https://futureplus.ncku.edu.tw/ncku_fsp/', description: '成功大學 futureplus' },
                    { url: 'https://course.ncku.edu.tw/', description: '成功大學 課程資訊及選課系統' }
                ]
            },
            {
                name: '國立清華大學',
                websites: [
                    { url: 'https://www.nthu.edu.tw', description: '清華大學首頁' },
                    { url: 'https://www.ccxp.nthu.edu.tw/ccxp/INQUIRE/', description: '清華大學 校務資訊系統' },
                    { url: 'https://curricul.site.nthu.edu.tw/', description: '清華大學 課務組' }
                ]
            },
            {
                name: '國立陽明交通大學',
                websites: [
                    { url: 'https://www.nctu.edu.tw', description: '陽明交通大學首頁' },
                    { url: 'https://portal.nycu.edu.tw/', description: '陽明交通大學 校務行政系統' },
                    { url: 'https://course.nycu.edu.tw/', description: '陽明交通大學 選課系統' },
                    { url: 'https://www.lib.nycu.edu.tw/', description: '陽明交通大學 圖書館' }
                ]
            },
            {
                name: '國立中山大學',
                websites: [
                    { url: 'https://www.nsysu.edu.tw', description: '中山大學首頁' },
                    { url: 'https://sis.nsysu.edu.tw', description: '中山大學 學務綜合資訊平台' },
                    { url: 'https://lis.nsysu.edu.tw', description: '中山大學 圖書館' },
                    { url: 'https://selcrs.nsysu.edu.tw/', description: '中山大學 選課系統' }
                ]
            },
            {
                name: '國立政治大學',
                websites: [
                    { url: 'https://www.nccu.edu.tw', description: '政治大學首頁' },
                    { url: 'https://i.nccu.edu.tw/Login.aspx', description: '政治大學 愛政大(校園個人化入口)' },
                    { url: 'https://www.lib.nccu.edu.tw', description: '政治大學 圖書館' },
                    { url: 'https://wm5.nccu.edu.tw/', description: '政治大學 WM5' }
                ]
            },
            {
                name: '國立臺灣師範大學',
                websites: [
                    { url: 'https://www.ntnu.edu.tw', description: '臺灣師範大學首頁' },
                    { url: 'https://toc.co.ntnu.edu.tw', description: '臺灣師範大學 TOC' },
                    { url: 'https://moodle.ntnu.edu.tw', description: '臺灣師範大學 Moodle' }
                ]
            },
            {
                name: '國立臺灣科技大學',
                websites: [
                    { url: 'https://www.ntust.edu.tw', description: '臺灣科技大學首頁' },
                    { url: 'https://i.ntust.edu.tw/student', description: '臺灣科技大學 校務行政系統(學生)' },
                    { url: 'https://library.ntust.edu.tw/', description: '臺灣科技大學 圖書館' }
                ]
            },
            {
                name: '國立屏東科技大學',
                websites: [
                    { url: 'https://www.npust.edu.tw', description: '屏東科技大學首頁' },
                    { url: 'https://course.npust.edu.tw/CnAds/', description: '屏東科技大學 校務行政系統' },
                    { url: 'https://course.npust.edu.tw/Course/', description: '屏東科技大學 選課系統' },
                    { url: 'https://osas.npust.edu.tw/alltop/', description: '屏東科技大學 通行證申請系統' },
                    { url: 'https://lib2.npust.edu.tw/', description: '屏東科技大學 圖書館' }
                ]
            },
            {
                name: '南臺科技大學',
                websites: [
                    { url: 'https://www.stust.edu.tw/', description: '南臺科技大學首頁' },
                    { url: 'https://eportal.stust.edu.tw/', description: '南臺科技大學 E網通' },
                    { url: 'https://portal.stust.edu.tw/abs_stu/checkin.asp', description: '南臺科技大學 請假系統' },
                    { url: 'https://course.stust.edu.tw/CourSel/Login.aspx', description: '南臺科技大學 選課系統' },
                    { url: 'https://flipclass.stust.edu.tw/', description: '南臺科技大學 FlipClass' },
                    { url: 'http://lib.stust.edu.tw/', description: '南臺科技大學 圖書館' },
                    { url: 'https://portal.stust.edu.tw/studclub/Login.aspx', description: '南臺科技大學 社團課程管理系統' },
                    { url: 'https://portal.stust.edu.tw/CourseWaived/Login.aspx', description: '南臺科技大學 學分抵免系統' },
                    { url: 'https://webap.stust.edu.tw/pwd/Index.aspx', description: '南臺科技大學 校務帳號密碼啟用/變更入口系統' }
                ]
            },
            {
                name: '龍華科技大學',
                websites: [
                    { url: 'https://www.lhu.edu.tw', description: '龍華科技大學首頁' },
                    { url: 'https://eportal.lhu.edu.tw/index.do', description: '龍華科技大學 校務行政系統' },
                    { url: 'https://e-learning.lhu.edu.tw/mooc/index.php', description: '龍華科技大學 數位學習平台' },
                    { url: 'https://il.lhu.edu.tw/', description: '龍華科技大學 圖書館' }
                ]
            },
            {
                name: '臺北醫學大學',
                websites: [
                    { url: 'https://www.tmu.edu.tw', description: '臺北醫學大學首頁' },
                    { url: 'https://newacademic.tmu.edu.tw/', description: '臺北醫學大學 教務學務系統' },
                    { url: 'https://library.tmu.edu.tw/', description: '臺北醫學大學 圖書館' }
                ]
            }
        ];


        let activeCard = null;
        let originalCardRect = null;
        const closeButton = document.getElementById('closeButton');

        function getIconForWebsite(description) {
            if (description.includes('首頁')) return 'fa-home';
            if (description.includes('圖書館')) return 'fa-book';
            if (description.includes('選課')) return 'fa-calendar';
            if (description.includes('Moodle')) return 'fa-graduation-cap';
            if (description.includes('入口')) return 'fa-door-open';
            if (description.includes('校務')) return 'fa-graduation-cap';
            return 'fa-link';
        }

        function createUniversityCard(university) {
            const card = document.createElement('div');
            card.className = 'university-card';
            card.innerHTML = `
                <div class="university-name">${university.name}</div>
                <div class="website-count">
                    <i class="fas fa-link"></i> ${university.websites.length} 個相關網站
                </div>
                <div class="website-grid"></div>
            `;
            
            card.addEventListener('click', () => expandCard(card, university));
            return card;
        }

        function createWebsiteItems(websites) {
            return websites.map((site, index) => `
                <div class="website-item" style="transition-delay: ${index * 0.1}s">
                    <a href="${site.url}" target="_blank" class="website-link">
                        <div class="website-icon">
                            <i class="fas ${getIconForWebsite(site.description)}"></i>
                        </div>
                        <div class="website-info">
                            <div class="website-description">${site.description}</div>
                        </div>
                    </a>
                </div>
            `).join('');
        }

        function expandCard(card, university) {
            if (activeCard) return;
            activeCard = card;

            originalCardRect = card.getBoundingClientRect();
            
            card.style.width = `${originalCardRect.width}px`;
            card.style.height = `${originalCardRect.height}px`;
            card.style.position = 'fixed';
            card.style.left = `${originalCardRect.left}px`;
            card.style.top = `${originalCardRect.top}px`;
            card.style.margin = '0';
            card.classList.add('expanding');

            const websiteGrid = card.querySelector('.website-grid');
            websiteGrid.innerHTML = createWebsiteItems(university.websites);

            requestAnimationFrame(() => {
                closeButton.classList.add('active');
                
                card.style.width = '90vw';
                card.style.height = '80vh';
                card.style.left = '5vw';
                card.style.top = '10vh';
                card.classList.add('expanded');

                setTimeout(() => {
                    websiteGrid.classList.add('active');
                }, 300);
            });
        }

        function closeExpandedCard() {
            if (!activeCard || !originalCardRect) return;

            const websiteGrid = activeCard.querySelector('.website-grid');
            websiteGrid.classList.remove('active');
            activeCard.classList.remove('expanded');

            setTimeout(() => {
                activeCard.style.width = `${originalCardRect.width}px`;
                activeCard.style.height = `${originalCardRect.height}px`;
                activeCard.style.left = `${originalCardRect.left}px`;
                activeCard.style.top = `${originalCardRect.top}px`;

                closeButton.classList.remove('active');

                activeCard.addEventListener('transitionend', function handler() {
                    activeCard.removeEventListener('transitionend', handler);
                    activeCard.classList.remove('expanding');
                    activeCard.style = '';
                    websiteGrid.innerHTML = '';
                    activeCard = null;
                    originalCardRect = null;
                }, { once: true });
            }, 300);
        }

        function renderUniversities(universities) {
            const grid = document.getElementById('universityGrid');
            grid.innerHTML = '';
            universities.forEach((university, index) => {
                const card = createUniversityCard(university);
                card.dataset.id = index;
                grid.appendChild(card);
            });
        }

        closeButton.addEventListener('click', closeExpandedCard);

        const searchInput = document.querySelector('.search-input');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredUniversities = schoolsData.filter(university => 
                university.name.toLowerCase().includes(searchTerm)
            );
            renderUniversities(filteredUniversities);
        });

        // 初始渲染
        renderUniversities(schoolsData);
    </script>
</body>
</html>
